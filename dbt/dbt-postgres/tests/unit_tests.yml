# ── Unit tests (dbt >= 1.8) ────────────────────────────────────────────────
# Unit tests validate transformation logic with static mock inputs.
# They do NOT hit the database — run only in dev/CI.
#
# Run:  dbt test --select "test_type:unit"
# Skip: dbt test --exclude "test_type:unit"  (for production)

unit_tests:
  - name: test_fct_orders_payment_flag
    description: >
      Verify that is_fully_paid is true only when amount_paid >= order_total.
    model: fct_orders
    given:
      - input: ref('int_orders_enriched')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2025-01-01', status: 'completed', is_completed: true, order_total_usd: 100.00, item_count: 2, amount_paid_usd: 100.00, payment_count: 1, is_fully_paid: true}
          - {order_id: 2, customer_id: 20, order_date: '2025-01-02', status: 'completed', is_completed: true, order_total_usd: 50.00, item_count: 1, amount_paid_usd: 30.00, payment_count: 1, is_fully_paid: false}
      - input: ref('stg_shopify__customers')
        rows:
          - {customer_id: 10, first_name: 'Alice', last_name: 'Smith', email: 'alice@test.com', country_code: 'US', created_at: '2025-01-01'}
          - {customer_id: 20, first_name: 'Bob', last_name: 'Jones', email: 'bob@test.com', country_code: 'GB', created_at: '2025-01-01'}
    expect:
      rows:
        - {order_id: 1, customer_id: 10, customer_name: 'Alice Smith', country_code: 'US', order_date: '2025-01-01', order_status: 'completed', is_completed: true, item_count: 2, order_total_usd: 100.00, amount_paid_usd: 100.00, payment_count: 1, is_fully_paid: true}
        - {order_id: 2, customer_id: 20, customer_name: 'Bob Jones', country_code: 'GB', order_date: '2025-01-02', order_status: 'completed', is_completed: true, item_count: 1, order_total_usd: 50.00, amount_paid_usd: 30.00, payment_count: 1, is_fully_paid: false}
