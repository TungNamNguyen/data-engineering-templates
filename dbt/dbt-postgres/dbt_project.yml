name: 'dbt_postgres'
version: '1.0.0'
config-version: 2

# Profile name — must match a key in ../profiles.yml (DBT_PROFILES_DIR points
# at the monorepo root).
profile: 'dbt_postgres'

model-paths:    ["models"]
seed-paths:     ["seeds"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Medallion layout. Schemas here are written literally — see
# macros/generate_schema_name.sql, which overrides dbt's default of
# concatenating target.schema + custom_schema_name.
seeds:
  dbt_postgres:
    bronze:
      +schema: bronze

models:
  dbt_postgres:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
