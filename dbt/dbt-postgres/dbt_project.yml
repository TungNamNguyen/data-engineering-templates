name: 'dbt_postgres'
version: '1.0.0'
config-version: 2

profile: 'dbt_postgres'

model-paths:    ["models"]
seed-paths:     ["seeds"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Variables ─────────────────────────────────────────────────────────────
vars:
  source_schema: raw

# ── Seeds ─────────────────────────────────────────────────────────────────
seeds:
  dbt_postgres:
    +schema: raw

# ── Models ────────────────────────────────────────────────────────────────
# Three-layer architecture: staging → intermediate → marts.
# Schema names are used verbatim — see macros/generate_schema_name.sql.
models:
  dbt_postgres:
    staging:
      +schema: staging
      +materialized: view
      +tags: ['staging']
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
      +tags: ['intermediate']
    marts:
      +schema: marts
      +materialized: table
      +tags: ['marts']
      core:
        +group: core
      finance:
        +group: finance

# ── Snapshots ─────────────────────────────────────────────────────────────
snapshots:
  dbt_postgres:
    +target_schema: snapshots

# ── Tests ─────────────────────────────────────────────────────────────────
tests:
  dbt_postgres:
    +severity: warn
