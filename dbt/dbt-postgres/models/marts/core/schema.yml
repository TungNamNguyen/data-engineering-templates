version: 2

models:
  - name: dim_customers
    description: "Customer dimension — one row per customer with lifetime metrics."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: integer
        constraints: [{type: not_null}]
        tests: [unique, not_null]
      - name: first_name
        data_type: text
        constraints: [{type: not_null}]
      - name: last_name
        data_type: text
        constraints: [{type: not_null}]
      - name: full_name
        data_type: text
      - name: email
        data_type: text
        constraints: [{type: not_null}]
      - name: country_code
        data_type: text
      - name: country_name
        data_type: text
      - name: created_at
        data_type: date
        constraints: [{type: not_null}]
      - name: order_count
        data_type: integer
      - name: completed_order_count
        data_type: integer
      - name: lifetime_spend_usd
        data_type: numeric
      - name: lifetime_paid_usd
        data_type: numeric
      - name: first_order_date
        data_type: date
      - name: last_order_date
        data_type: date

  - name: dim_products
    description: "Product dimension — catalogue with sales metrics."
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        data_type: integer
        constraints: [{type: not_null}]
        tests: [unique, not_null]
      - name: product_name
        data_type: text
        constraints: [{type: not_null}]
      - name: category
        data_type: text
      - name: price_usd
        data_type: numeric
      - name: is_active
        data_type: boolean
      - name: created_at
        data_type: date
      - name: total_units_sold
        data_type: integer
      - name: total_revenue_usd
        data_type: numeric
      - name: order_count
        data_type: integer

  - name: fct_orders
    description: "Order fact — one row per order with customer and payment context."
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: integer
        constraints: [{type: not_null}]
        tests: [unique, not_null]
      - name: customer_id
        data_type: integer
        constraints: [{type: not_null}]
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: customer_name
        data_type: text
      - name: country_code
        data_type: text
      - name: order_date
        data_type: date
        constraints: [{type: not_null}]
      - name: order_status
        data_type: text
      - name: is_completed
        data_type: boolean
      - name: item_count
        data_type: integer
      - name: order_total_usd
        data_type: numeric
      - name: amount_paid_usd
        data_type: numeric
      - name: payment_count
        data_type: integer
      - name: is_fully_paid
        data_type: boolean

  - name: fct_order_items
    description: "Order line-item fact — one row per item in an order."
    config:
      contract:
        enforced: true
    columns:
      - name: order_item_id
        data_type: integer
        constraints: [{type: not_null}]
        tests: [unique, not_null]
      - name: order_id
        data_type: integer
        constraints: [{type: not_null}]
      - name: customer_id
        data_type: integer
      - name: order_date
        data_type: date
      - name: product_id
        data_type: integer
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: product_name
        data_type: text
      - name: category
        data_type: text
      - name: quantity
        data_type: integer
      - name: unit_price_usd
        data_type: numeric
      - name: line_total_usd
        data_type: numeric
