version: 2

models:
  - name: gold_daily_revenue
    description: "Completed-order revenue, aggregated per day."
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: completed_orders
        tests: [not_null]
      - name: revenue_usd
        tests: [not_null]

  - name: gold_customer_lifetime_value
    description: "One row per customer with lifetime order count and spend."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: lifetime_value_usd
        tests: [not_null]
