version: 2

seeds:
  - name: raw_customers
    description: "Simulated raw customer records (stand-in for an ingestion landing table)."
    columns:
      - name: id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
      - name: country_code
        tests:
          - relationships:
              to: ref('country_codes')
              field: code

  - name: raw_orders
    description: "Simulated raw order records. `amount_cents` is integer cents."
    columns:
      - name: id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('raw_customers')
              field: id
      - name: status
        tests:
          - accepted_values:
              values: ['pending', 'completed', 'refunded']

  - name: country_codes
    description: "ISO-like country code to name lookup."
    columns:
      - name: code
        tests: [unique, not_null]
