# Pre-commit hooks. Bootstrap with:
#   uv run pre-commit install
#
# The sqlfluff hook uses the uv-managed venv (language: system) so it shares
# the same sqlfluff + dbt versions as the project — avoids the classic pain
# of pre-commit resolving its own sqlfluff that disagrees with your local
# install.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        language: system
        entry: uv run sqlfluff lint
        files: ^dbt-postgres/(models|analyses|tests|macros|snapshots)/.*\.sql$
        pass_filenames: true

      - id: sqlfluff-fix
        name: sqlfluff fix (check mode — no changes written)
        language: system
        entry: uv run sqlfluff fix --check
        files: ^dbt-postgres/(models|analyses|tests|macros|snapshots)/.*\.sql$
        pass_filenames: true
        stages: [manual]
