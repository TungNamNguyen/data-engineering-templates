# DuckDB — file-based analytical DWH using the upstream official image.
#
# No Dockerfile, no build step: both services run the unmodified
# upstream `duckdb/duckdb` image. The upstream image is distroless
# (only the `/duckdb` binary; no shell, no coreutils), so init is
# done via the DuckDB CLI's own `.read` meta-command rather than a
# bash loop over initdb.d — each file is invoked explicitly in the
# `duckdb-init` command array below, in numeric order.
#
# Architecture:
#   * `duckdb` (main) — ephemeral CLI sessions spawned via
#       `docker compose run --rm duckdb /data/app.duckdb`
#     Because DuckDB is embedded with no server daemon, there is
#     nothing to keep running between sessions. The service is under
#     the `cli` profile so `docker compose up -d` ignores it.
#
#   * `duckdb-init` — one-shot initializer that opens /data/${DUCKDB_DB}
#     and runs every file in ./initdb.d in order via `-c ".read ..."`.
#     Creates the file if missing (DuckDB does this automatically on
#     first open). `restart: "no"` — runs on every `docker compose up
#     -d`, all SQL is idempotent.
#
# Usage:
#   docker compose up -d                               # runs duckdb-init
#   docker compose run --rm duckdb /data/app.duckdb    # opens the CLI
#   docker compose run --rm duckdb /data/app.duckdb \
#       -c "SELECT count(*) FROM gold.daily_revenue;"  # one-off query
#
# All configuration has sensible defaults — copy .env.example to .env
# only if you want to override DUCKDB_VERSION or DUCKDB_DB.

services:
  duckdb:
    image: duckdb/duckdb:${DUCKDB_VERSION:-1.4.0}
    container_name: duckdb
    hostname: duckdb
    # Ephemeral-only: no long-running command, so the service lives
    # under the `cli` profile. `docker compose up -d` ignores it;
    # `docker compose run --rm duckdb ...` activates it on demand and
    # implicitly triggers `duckdb-init` via the dependency below.
    profiles: ["cli"]
    depends_on:
      duckdb-init:
        condition: service_completed_successfully
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
    working_dir: /data
    # The upstream image declares `CMD ["/duckdb"]` with no ENTRYPOINT,
    # so `docker compose run duckdb <args>` would replace the whole
    # command and try to exec <args>. Pin entrypoint to /duckdb so
    # user-supplied args are passed to the CLI as positional arguments.
    entrypoint: ["/duckdb"]
    stop_grace_period: 5s

  # One-shot initializer. Opens /data/${DUCKDB_DB} (creating it if
  # missing) and `.read`s every file in ./initdb.d in numeric order.
  #
  # File list below is explicit rather than a directory walk because
  # the distroless upstream image has no shell to loop with. If you
  # add a new initdb.d/*.sql file, add a matching `-c ".read ..."`
  # line here too.
  duckdb-init:
    image: duckdb/duckdb:${DUCKDB_VERSION:-1.4.0}
    container_name: duckdb-init
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
      - ./initdb.d:/initdb.d:ro
    entrypoint: ["/duckdb"]
    command:
      - /data/${DUCKDB_DB:-app.duckdb}
      - -c
      - .read /initdb.d/01-infra-setup.sql
      - -c
      - .read /initdb.d/02-logical-setup.sql
      - -c
      - .read /initdb.d/03-governance.sql
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
