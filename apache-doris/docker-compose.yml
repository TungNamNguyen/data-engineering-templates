# Apache Doris local development setup.
#
# Default: 1 FE + 1 BE — minimal and lightweight for local dev.
#
# Usage:
#   docker compose up -d
#
# Connect via MySQL client:
#   mysql -h 127.0.0.1 -P 9030 -u root -p
#
# Web UI (no auth):
#   http://localhost:8030
#
# ──────────────────────────────────────────────────────────────────────
# IMPORTANT — Host kernel requirement (required for BE):
#   sudo sysctl -w vm.max_map_count=2000000
#   echo "vm.max_map_count=2000000" | sudo tee -a /etc/sysctl.conf
#
# ──────────────────────────────────────────────────────────────────────
# Production-like setup (3 FE + 3 BE):
#
# 1. Uncomment doris-fe-2, doris-fe-3, doris-be-2, doris-be-3 and
#    their volumes below.
# 2. Uncomment deploy.resources blocks for resource limits.
# 3. Create tables with: PROPERTIES("replication_num" = "3")
# ──────────────────────────────────────────────────────────────────────

services:
  doris-fe:
    image: ${FE_IMAGE}
    container_name: doris-fe
    hostname: doris-fe
    environment:
      FE_SERVERS: "fe1:10.10.80.2:${FE_EDIT_LOG_PORT:-9010}"
      FE_ID: 1
      DORIS_ROOT_PASSWORD: ${DORIS_ROOT_PASSWORD:-}
    ports:
      - "${FE_QUERY_PORT:-9030}:9030"
      - "${FE_HTTP_PORT:-8030}:8030"
    volumes:
      - ./conf/fe.conf:/opt/apache-doris/fe/conf/fe.conf
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      doris-net:
        ipv4_address: 10.10.80.2
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8030/api/bootstrap"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
