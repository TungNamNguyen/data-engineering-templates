  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '8'
  #         memory: 16G
  #       reservations:
  #         cpus: '4'
  #         memory: 8G

  doris-be:
    image: ${BE_IMAGE}
    container_name: doris-be
    hostname: doris-be
    # Bypass swap check — Doris BE's start_be.sh hardcodes a swap check
    # that exits if the host has swap enabled, with no config flag to
    # disable it. The fake `swapon` shim reports no swap and makes the
    # check pass. Root-password setup and initdb.d execution are handled
    # by the doris-init sidecar below, not here.
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /tmp/noswap
        echo '#!/bin/bash
        echo Filename' > /tmp/noswap/swapon
        chmod +x /tmp/noswap/swapon
        export PATH=/tmp/noswap:$$PATH
        exec bash entry_point.sh
    environment:
      FE_SERVERS: "fe1:10.10.80.2:${FE_EDIT_LOG_PORT:-9010}"
      BE_ADDR: "10.10.80.3:${BE_HEARTBEAT_PORT:-9050}"
    ports:
      - "${BE_WEBSERVER_PORT:-8040}:8040"
    volumes:
      - ./conf/be.conf:/opt/apache-doris/be/conf/be.conf
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-net:
        ipv4_address: 10.10.80.3
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8040/api/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Production:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 16G
    #     reservations:
    #       cpus: '4'
    #       memory: 8G

  # One-shot initializer. Waits for FE + BE, then dispatches every *.sh
  # and *.sql in ./initdb.d in alphabetical order via the mysql client.
  # Runs the full 01-infra-setup.sh -> 02-logical-setup.sql ->
  # 03-governance.sql pipeline: set root password, create databases,
  # create service accounts, grant privileges.
  doris-init:
    image: mysql:8.4
    container_name: doris-init
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_healthy
    environment:
      DORIS_FE_HOST: 10.10.80.2
      DORIS_FE_PORT: 9030
      DORIS_ROOT_PASSWORD: ${DORIS_ROOT_PASSWORD:-}
      TRANSFORM_USER_PASSWORD: ${TRANSFORM_USER_PASSWORD}
      READ_USER_PASSWORD: ${READ_USER_PASSWORD}
    volumes:
      - ./initdb.d:/initdb.d:ro
    networks:
      - doris-net
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        echo "[doris-init] waiting for FE query port to accept connections..."
        for i in $$(seq 1 60); do
          if mysql -h "$$DORIS_FE_HOST" -P "$$DORIS_FE_PORT" -u root -e "SELECT 1" >/dev/null 2>&1; then
            echo "[doris-init] FE ready"
            break
          fi
          sleep 5
        done

        # After 01-infra-setup.sh runs, subsequent .sql files need to
        # authenticate with the (possibly newly-set) root password.
        _MYSQL_OPTS=(-h "$$DORIS_FE_HOST" -P "$$DORIS_FE_PORT" -u root)
        if [ -n "$${DORIS_ROOT_PASSWORD:-}" ]; then
          _MYSQL_OPTS+=(-p"$$DORIS_ROOT_PASSWORD")
        fi

        shopt -s nullglob
        for f in /initdb.d/*; do
          case "$$f" in
            *.sh)
              echo "[doris-init] running $$f"
              bash "$$f"
              ;;
            *.sql)
              echo "[doris-init] running $$f"
              mysql "$${_MYSQL_OPTS[@]}" < "$$f"
              ;;
          esac
        done
        echo "[doris-init] done"
    restart: "no"

