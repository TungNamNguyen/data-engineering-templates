# Apache Doris — 1 FE + 1 BE with production-grade container settings.
#
# Per the Doris docs, 1 FE + 1 BE is a dev/test topology: one BE means one
# replica, so a lost disk is lost data. Production is >= 3 FE + >= 3 BE —
# the extra nodes are pre-written below, commented out. Everything else
# (volumes, healthchecks, ulimits, tuned conf/, restart policy) is the same
# in both topologies.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Connect via MySQL client (root has no password until you set one — see README):
#   mysql -h 127.0.0.1 -P 9030 -u root
#
# Web UI (no auth, bound to 127.0.0.1 by default):
#   http://localhost:8030
#
# ──────────────────────────────────────────────────────────────────────
# Host requirements (see README "Prerequisites" for the full list):
#   sudo sysctl -w vm.max_map_count=2000000     # required — BE refuses to start
#   sudo swapoff -a                             # required in production
#   grep -q avx2 /proc/cpuinfo                  # required — official image is AVX2-only
#
# ──────────────────────────────────────────────────────────────────────
# Production setup (3 FE + 3 BE):
#
# 1. Uncomment doris-fe-2, doris-fe-3, doris-be-2, doris-be-3 and
#    their volumes below.
# 2. Uncomment deploy.resources blocks for resource limits.
# 3. Switch conf/fe.conf and conf/be.conf to the "# Production:" values.
# 4. Create tables with: PROPERTIES("replication_num" = "3")
# ──────────────────────────────────────────────────────────────────────

services:
  doris-fe:
    image: ${FE_IMAGE}
    container_name: doris-fe
    hostname: doris-fe
    environment:
      FE_SERVERS: "fe1:10.10.80.2:${FE_EDIT_LOG_PORT:-9010}"
      FE_ID: 1
    ports:
      - "${FE_QUERY_PORT:-9030}:9030"
      # Web UI + REST API have no auth — bound to loopback by default.
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${FE_HTTP_PORT:-8030}:8030"
    volumes:
      - ./conf/fe.conf:/opt/apache-doris/fe/conf/fe.conf
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      doris-net:
        ipv4_address: 10.10.80.2
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8030/api/bootstrap"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Production:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 16G
    #     reservations:
    #       cpus: '4'
    #       memory: 8G

