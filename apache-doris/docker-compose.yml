  #       reservations:
  #         cpus: '4'
  #         memory: 8G

  doris-be:
    image: ${BE_IMAGE}
    container_name: doris-be
    hostname: doris-be
    # Bypass swap check + set root password from DORIS_ROOT_PASSWORD env var.
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /tmp/noswap
        echo '#!/bin/bash
        echo Filename' > /tmp/noswap/swapon
        chmod +x /tmp/noswap/swapon
        export PATH=/tmp/noswap:$$PATH
        if [ -n "$$DORIS_ROOT_PASSWORD" ]; then
          ( sleep 90 && mysql -h 10.10.80.2 -P 9030 -u root \
            -e "ALTER USER 'root'@'%' IDENTIFIED BY '$$DORIS_ROOT_PASSWORD';" \
            2>/dev/null && echo "Root password set." ) &
        fi
        exec bash entry_point.sh
    environment:
      FE_SERVERS: "fe1:10.10.80.2:${FE_EDIT_LOG_PORT:-9010}"
      BE_ADDR: "10.10.80.3:${BE_HEARTBEAT_PORT:-9050}"
      DORIS_ROOT_PASSWORD: ${DORIS_ROOT_PASSWORD:-}
    ports:
      - "${BE_WEBSERVER_PORT:-8040}:8040"
    volumes:
      - ./conf/be.conf:/opt/apache-doris/be/conf/be.conf
      - ./initdb.d:/docker-entrypoint-initdb.d
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-net:
        ipv4_address: 10.10.80.3
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8040/api/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
