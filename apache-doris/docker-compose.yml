networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.80.0/24

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
  # ── Uncomment for production setup (3 FE + 3 BE) ──
