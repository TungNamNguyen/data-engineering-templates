  #       reservations:
  #         cpus: '4'
  #         memory: 8G

  doris-be:
    image: ${BE_IMAGE}
    container_name: doris-be
    hostname: doris-be
    # Bypass swap check — Doris BE's start_be.sh hardcodes a swap check
    # that exits if the host has swap enabled, with no config flag to
    # disable it. The fake `swapon` shim reports no swap and makes the
    # check pass.
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /tmp/noswap
        echo '#!/bin/bash
        echo Filename' > /tmp/noswap/swapon
        chmod +x /tmp/noswap/swapon
        export PATH=/tmp/noswap:$$PATH
        exec bash entry_point.sh
    environment:
      FE_SERVERS: "fe1:10.10.80.2:${FE_EDIT_LOG_PORT:-9010}"
      BE_ADDR: "10.10.80.3:${BE_HEARTBEAT_PORT:-9050}"
    ports:
      # BE status page — only FE needs it; loopback-only on the host.
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${BE_WEBSERVER_PORT:-8040}:8040"
    volumes:
      - ./conf/be.conf:/opt/apache-doris/be/conf/be.conf
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-net:
        ipv4_address: 10.10.80.3
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8040/api/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
