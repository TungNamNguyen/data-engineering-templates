# Apache Doris BE Configuration
# Docs: https://doris.apache.org/docs/admin-manual/config/be-config
#
# Settings can also be changed at runtime without restart:
#   ADMIN SET BACKEND CONFIG ("key" = "value");
#   SHOW BACKEND CONFIG LIKE "%key%";

# ── Memory ─────────────────────────────────────────────────────────────
mem_limit = 80%
# Production:
# mem_limit = 90%

# ── JVM ────────────────────────────────────────────────────────────────
# Local dev: 512MB. Production: 2-4GB.
JAVA_OPTS_FOR_JDK_17 = "-Xmx512m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=${LOG_DIR}/be_oom.hprof"
# Production:
# JAVA_OPTS_FOR_JDK_17 = "-Xmx4096m -Xms4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=${LOG_DIR}/be_oom.hprof"

# ── Compaction ─────────────────────────────────────────────────────────
max_base_compaction_threads = 2
max_cumu_compaction_threads = 2
compaction_task_num_per_disk = 2
compaction_task_num_per_fast_disk = 4
# Production:
# max_base_compaction_threads = 4
# max_cumu_compaction_threads = -1
# compaction_task_num_per_disk = 4
# compaction_task_num_per_fast_disk = 8

# ── Buffer ─────────────────────────────────────────────────────────────
write_buffer_size = 67108864
# Production:
# write_buffer_size = 209715200

# ── Logging ────────────────────────────────────────────────────────────
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-512
sys_log_roll_num = 5
# Production:
# sys_log_roll_mode = SIZE-MB-1024
# sys_log_roll_num = 10
priority_networks = 10.10.80.0/24
