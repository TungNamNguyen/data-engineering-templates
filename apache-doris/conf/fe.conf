# Apache Doris FE Configuration
# Docs: https://doris.apache.org/docs/admin-manual/config/fe-config
#
# Settings can also be changed at runtime without restart:
#   ADMIN SET FRONTEND CONFIG ("key" = "value");
#   SHOW FRONTEND CONFIG LIKE "%key%";

# ── JVM Heap ───────────────────────────────────────────────────────────
# Local dev: 1GB. Production: 16GB+.
JAVA_OPTS_FOR_JDK_17 = "-Xmx1024m -Xms1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=${LOG_DIR}/fe_oom.hprof"
# Production:
# JAVA_OPTS_FOR_JDK_17 = "-Xmx16384m -Xms16384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=${LOG_DIR}/fe_oom.hprof"

# ── Connections ────────────────────────────────────────────────────────
qe_max_connection = 256
max_running_txn_num_per_db = 100
# Production:
# qe_max_connection = 2048
# max_running_txn_num_per_db = 2000

# ── Metadata ───────────────────────────────────────────────────────────
edit_log_roll_num = 50000
max_bdbje_clock_delta_ms = 5000
meta_delay_toleration_second = 300

# ── Storage thresholds ─────────────────────────────────────────────────
storage_flood_stage_usage_percent = 95

# ── Logging ────────────────────────────────────────────────────────────
sys_log_level = INFO
priority_networks = 10.10.80.0/24
