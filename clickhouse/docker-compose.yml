# ClickHouse — lightweight, production-ready single-node setup.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Connect:
#   docker exec -it clickhouse clickhouse-client --user default --password
#   curl -u default:$CLICKHOUSE_PASSWORD http://localhost:8123/ping

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    container_name: clickhouse
    hostname: clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"      # HTTP / DBeaver / JDBC
      - "${CLICKHOUSE_NATIVE_PORT}:9000"    # Native protocol / clickhouse-client
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Production: uncomment and tune to your host
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 16G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

volumes:
  clickhouse-data:
  clickhouse-logs:
