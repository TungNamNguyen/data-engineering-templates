# Apache Superset — production-ready single-host stack.
#
# Services: Superset web (gunicorn) + Celery worker + Celery beat
#           + Postgres (metadata DB) + Redis (cache, results, broker).
#
# Usage:
#   cp .env.example .env          # edit SUPERSET_SECRET_KEY and admin password first
#   docker compose up -d
#   open http://localhost:8088
#
# The superset_config.py and init script are injected as Compose `configs`,
# so this template is self-contained — no extra files to mount.
#
# To add SQLAlchemy drivers for external warehouses (ClickHouse, Doris,
# Snowflake, Trino, DuckDB, ...), set ADDITIONAL_PIP_PACKAGES in .env.

x-superset-common: &superset-common
  image: ${SUPERSET_IMAGE}
  env_file: .env
  environment: &superset-common-env
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    PYTHONPATH: /app/pythonpath:/app/docker/pythonpath_dev
    # Metadata DB wiring — consumed by superset_config.py
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${POSTGRES_DB}
    DB_USER: ${POSTGRES_USER}
    DB_PASS: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-no}
    # Extra drivers installed at container start (no rebuild needed).
    # Example: "clickhouse-connect==0.8.6 duckdb-engine==0.13.2 pymssql==2.3.0"
    ADDITIONAL_PIP_PACKAGES: ${ADDITIONAL_PIP_PACKAGES:-}
  configs:
    - source: superset_config
      target: /app/pythonpath/superset_config.py
    - source: superset_bootstrap
      target: /app/docker/bootstrap.sh
      mode: 0755
  volumes:
    - superset-home:/app/superset_home
  depends_on: &superset-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    container_name: superset-redis
    hostname: redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: superset-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    container_name: superset-init
    command: ["/bin/bash", "/app/docker/bootstrap.sh", "init"]
    healthcheck:
      disable: true
    restart: "no"

  superset:
    <<: *superset-common
    container_name: superset
    command: ["/bin/bash", "/app/docker/bootstrap.sh", "web"]
    ports:
      - "${SUPERSET_PORT}:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *superset-common-depends-on
      superset-init:
        condition: service_completed_successfully

  superset-worker:
    <<: *superset-common
    container_name: superset-worker
    command: ["/bin/bash", "/app/docker/bootstrap.sh", "worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping -d celery@$${HOSTNAME} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *superset-common-depends-on
      superset-init:
        condition: service_completed_successfully

  superset-worker-beat:
    <<: *superset-common
    container_name: superset-worker-beat
    command: ["/bin/bash", "/app/docker/bootstrap.sh", "beat"]
    healthcheck:
      disable: true
    depends_on:
      <<: *superset-common-depends-on
      superset-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  superset-home:

configs:
  superset_config:
    content: |
      # Generated by docker-compose — production-ready Superset config.
      import os
      from cachelib.redis import RedisCache
      from celery.schedules import crontab

      # --- Security ---
      SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]

      # --- Metadata database ---
      SQLALCHEMY_DATABASE_URI = (
          f"postgresql+psycopg2://{os.environ['DB_USER']}:{os.environ['DB_PASS']}"
          f"@{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/{os.environ['DB_NAME']}"
      )
      SQLALCHEMY_TRACK_MODIFICATIONS = False

      # --- Redis (cache, results, Celery broker) ---
      REDIS_HOST = os.environ.get("REDIS_HOST", "redis")
      REDIS_PORT = int(os.environ.get("REDIS_PORT", 6379))
      REDIS_CELERY_DB = 0
      REDIS_RESULTS_DB = 1
      REDIS_CACHE_DB = 2

      CACHE_CONFIG = {
          "CACHE_TYPE": "RedisCache",
          "CACHE_DEFAULT_TIMEOUT": 300,
          "CACHE_KEY_PREFIX": "superset_",
          "CACHE_REDIS_HOST": REDIS_HOST,
          "CACHE_REDIS_PORT": REDIS_PORT,
          "CACHE_REDIS_DB": REDIS_CACHE_DB,
      }
      DATA_CACHE_CONFIG = CACHE_CONFIG
      FILTER_STATE_CACHE_CONFIG = {**CACHE_CONFIG, "CACHE_DEFAULT_TIMEOUT": 86400}
      EXPLORE_FORM_DATA_CACHE_CONFIG = {**CACHE_CONFIG, "CACHE_DEFAULT_TIMEOUT": 86400}

      RESULTS_BACKEND = RedisCache(
          host=REDIS_HOST, port=REDIS_PORT,
          key_prefix="superset_results", db=REDIS_RESULTS_DB,
      )

      # --- Celery ---
      class CeleryConfig:
          broker_url = f"redis://{REDIS_HOST}:{REDIS_PORT}/{REDIS_CELERY_DB}"
          result_backend = f"redis://{REDIS_HOST}:{REDIS_PORT}/{REDIS_CELERY_DB}"
          imports = (
              "superset.sql_lab",
              "superset.tasks.scheduler",
              "superset.tasks.thumbnails",
              "superset.tasks.cache",
          )
          worker_prefetch_multiplier = 1
          task_acks_late = True
          task_annotations = {
              "sql_lab.get_sql_results": {"rate_limit": "100/s"},
          }
          beat_schedule = {
              "reports.scheduler": {
                  "task": "reports.scheduler",
                  "schedule": crontab(minute="*", hour="*"),
              },
              "reports.prune_log": {
                  "task": "reports.prune_log",
                  "schedule": crontab(minute=10, hour=0),
              },
          }

      CELERY_CONFIG = CeleryConfig

      # --- SQL Lab / query limits ---
      SQLLAB_CTAS_NO_LIMIT = True
      SQLLAB_TIMEOUT = 300
      SUPERSET_WEBSERVER_TIMEOUT = 300
      ROW_LIMIT = 100_000
      SQL_MAX_ROW = 100_000

      # --- Feature flags ---
      FEATURE_FLAGS = {
          "ALERT_REPORTS": True,
          "DASHBOARD_RBAC": True,
          "EMBEDDED_SUPERSET": True,
          "ENABLE_TEMPLATE_PROCESSING": True,
          "DASHBOARD_CROSS_FILTERS": True,
          "DRILL_BY": True,
          "DRILL_TO_DETAIL": True,
          "HORIZONTAL_FILTER_BAR": True,
      }

      # --- Reverse proxy (X-Forwarded-* headers) ---
      ENABLE_PROXY_FIX = True

      # --- Webdriver (for alerts/reports screenshots) ---
      WEBDRIVER_BASEURL = "http://superset:8088/"
      WEBDRIVER_BASEURL_USER_FRIENDLY = WEBDRIVER_BASEURL

      # --- Logging ---
      LOG_LEVEL = os.environ.get("SUPERSET_LOG_LEVEL", "INFO").upper()

  superset_bootstrap:
    content: |
      #!/usr/bin/env bash
      # Single entrypoint shared by web, worker, beat, and init services.
      # NOTE: $$ escapes Compose's variable interpolation — the container sees $.
      set -eo pipefail

      # psycopg2 is required for the Postgres metadata DB but is not shipped
      # in apache/superset:4.x. Install on every container start (fast no-op
      # if the wheel is already cached in the superset-home layer).
      REQUIRED_PIP_PACKAGES="psycopg2-binary==2.9.9"
      echo "Installing required pip packages: $${REQUIRED_PIP_PACKAGES}"
      pip install --no-cache-dir $${REQUIRED_PIP_PACKAGES}

      if [[ -n "$${ADDITIONAL_PIP_PACKAGES:-}" ]]; then
        echo "Installing extra pip packages: $${ADDITIONAL_PIP_PACKAGES}"
        pip install --no-cache-dir $${ADDITIONAL_PIP_PACKAGES}
      fi

      case "$${1:-web}" in
        init)
          echo ">> superset db upgrade"
          superset db upgrade

          echo ">> superset fab create-admin (idempotent)"
          superset fab create-admin \
            --username "$${SUPERSET_ADMIN_USERNAME}" \
            --firstname "$${SUPERSET_ADMIN_FIRSTNAME}" \
            --lastname  "$${SUPERSET_ADMIN_LASTNAME}" \
            --email     "$${SUPERSET_ADMIN_EMAIL}" \
            --password  "$${SUPERSET_ADMIN_PASSWORD}" || true

          echo ">> superset init (roles + permissions)"
          superset init

          if [[ "$${SUPERSET_LOAD_EXAMPLES}" == "yes" ]]; then
            echo ">> superset load-examples"
            superset load-examples || true
          fi
          ;;
        web)
          exec /usr/bin/run-server.sh
          ;;
        worker)
          exec celery --app=superset.tasks.celery_app:app worker \
            --loglevel=INFO --concurrency="$${CELERY_WORKER_CONCURRENCY:-4}"
          ;;
        beat)
          rm -f /tmp/celerybeat.pid
          exec celery --app=superset.tasks.celery_app:app beat \
            --pidfile=/tmp/celerybeat.pid \
            --schedule=/tmp/celerybeat-schedule \
            --loglevel=INFO
          ;;
        *)
          echo "Unknown command: $$1" >&2
          exit 1
          ;;
      esac
